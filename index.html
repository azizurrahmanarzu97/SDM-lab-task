<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 40px 0;
        }
        h2 {
            color: #000;
            font-weight: bold;
        }
         h2 .green {
            color: #28a745;
            font-weight: bold;
        }
        h4 {
            color: #2c3e50;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        .form-label {
            font-weight: 500;
            color: #333;
        }
        .form-control, .form-select {
            border-radius: 5px;
            padding: 10px;
        }
        .btn-create {
            background-color: #28a745;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            font-weight: 500;
            margin-top: 20px;
        }
        .btn-create:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2><span class="green">Create</span> <i>Profile</i></h2>
        <form>
            <h4>General Information</h4>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" name="firstName" id="firstName" placeholder="Enter First Name">
                </div>
                <div class="col-md-6">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" name="lastName" id="lastName" placeholder="Enter Last Name">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="department" class="form-label">Department</label>
                    <select id="department" name="department" class="form-select">
                        <option value="CSE">CSE</option>
                        <option value="EEE">EEE</option>
                        <option value="BBA">BBA</option>
                        <option value="Microbiology"></option>
                        <option value="Law"></option>
                        <option value="Civil">Civil</option>
                        <option value="English">English</option>
                        <option value="Social Science">Social Science</option>
                        <option value="Economics">Economics</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="ID" class="form-label">ID No</label>
                    <input type="text" class="form-control" name="ID" id="ID" placeholder="Ex-2003008">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="session" class="form-label">Session</label>
                    <input type="text" class="form-control" name="session" id="session" placeholder="Ex-2020-2021">
                </div>
                <div class="col-md-6">
                    <label for="semester" class="form-label">Semester</label>
                    <select id="semester" name="semester" class="form-select">
                        <option vlaue="1st year odd">1st year odd semester</option>
                        <option vlaue="1st year even">1st year even semester</option>
                        <option vlaue="2nd year odd">2nd year odd semester</option>
                        <option vlaue="2nd year even">2nd year even semester</option>
                        <option vlaue="3rd year odd">3rd year odd semester</option>
                        <option vlaue="3rd year even">3rd year even semester</option>
                        <option vlaue="4th year odd">4th year odd semester</option>
                        <option vlaue="4th year even">4th year even semester</option>
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="bloodGroup" class="form-label">Blood Group</label>
                    <input type="text" class="form-control" name="bloodGroup" id="bloodGroup" placeholder="Enter Blood Group">
                </div>
                <div class="col-md-6">
                    <label for="DOB" class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" name="DOB" id="DOB">
                </div>
            </div>

            <h4>Contact Information</h4>
            <div class="mb-3">
                <label for="mobileNumber" class="form-label">Mobile No.</label>
                <input type="text" class="form-control" name="mobileNumber" id="mobileNumber" placeholder="Enter Phone No.">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" name="email" id="email" placeholder="Enter your email">
            </div>

            <h4>Security Information</h4>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" name="password" id="password" placeholder="Enter strong password">
            </div>

            <h4>Address Information</h4>
            <div class="mb-3">
                <label for="permanentAddress" class="form-label">Permanent Address</label>
                <input type="text" class="form-control" name="permanentAddress" id="permanentAddress" placeholder="Enter Permanent Address">
            </div>
            <div class="mb-3">
                <label for="presentAddress" class="form-label">Present Address or Hall Name</label>
                <input type="text" class="form-control" name="presentAddress" id="presentAddress" placeholder="Enter Present Address">
            </div>

            <button type="button" class="btn btn-create">Create</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
